[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-synthetic"
version = "0.1.0"
description = "Deterministic healthcare synthetic-data development framework"
requires-python = ">=3.10"
dependencies = ["tzdata==2025.2"]

[tool.setuptools.packages.find]
where = ["src"]
